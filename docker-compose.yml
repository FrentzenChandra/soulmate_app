services:
  # 1. Web Server Apache / Laravel
  soulmate_apps:
    container_name: soulmate_apps
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "8000:80"
    volumes:
      - .:/var/www/html
    environment:
      - APACHE_DOCUMENT_ROOT=/var/www/html/public
    depends_on:
      postgresql_soulmate_app:
        condition: service_healthy
    networks:
      - soulmate_network

  # 2. Server WebSocket Reverb (Otomatis Nyala & Restart Sendiri)
  soulmate_reverb:
    container_name: soulmate_reverb
    build:
      context: .
      dockerfile: Dockerfile
    command: php artisan reverb:start --host=0.0.0.0 --port=8080
    restart: unless-stopped
    ports:
      - "8080:8080"
    volumes:
      - .:/var/www/html
    depends_on:
      postgresql_soulmate_app:
        condition: service_healthy
    networks:
      - soulmate_network

  # 3. Database PostgreSQL
  postgresql_soulmate_app:
    container_name: postgresql_soulmate_app
    image: postgres:16-alpine
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: postgresql_soulmate_app
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: secret123
    volumes:
      - postgresql_soulmate_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d postgresql_soulmate_app"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - soulmate_network

volumes:
  postgresql_soulmate_data:
    driver: local

networks:
  soulmate_network:
    driver: bridge
