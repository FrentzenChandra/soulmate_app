name: Auto Deploy to VPS

on:
  push:
    branches:
      - main
      - master

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to VPS via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.SSH_PORT || 22 }}
          script: |
            cd /var/www/soulmate_app
            echo "==> [1/4] Pulling latest code from GitHub..."
            git pull origin $(git rev-parse --abbrev-ref HEAD)

            echo "==> [2/4] Building frontend assets (Vite / Tailwind)..."
            if command -v npm >/dev/null 2>&1; then
                npm install --no-audit --no-fund
                npm run build
            fi

            echo "==> [3/4] Building / restarting Docker containers..."
            docker compose up -d --build

            echo "==> [4/4] Running Laravel deployment automation..."
            docker exec soulmate_apps sh docker/deploy.sh

            echo "==> [SUCCESS] Deployment completed successfully!"
